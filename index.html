         yön portrait-primary'de takılıyor, orientationchange hiç tetiklenmiyordu).
         Aynı satıra `viewport-fit=cover` eklenince dönme düzeldi: yatayda
         win 956x440, yön landscape-primary, sayfa ekranı boydan boya dolduruyor.
         DİKKAT: bunu ÇALIŞMA ZAMANINDA JS ile eklemek İŞE YARAMIYOR — eskiden
         App.jsx tema efektinin içinde ekliyordu, geç kaldığı için dönme bozuk
         kalıyordu. O yazım kaldırıldı; tek ve sabit tanım burasıdır.
         Meta'yı JS ile DEĞİŞTİRME. -->
