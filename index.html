<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <!-- VIEWPORT — viewport-fit=cover BURADA, SABİT OLMAK ZORUNDA.
         Telefonda ölçülerek bulundu: bu satırda `viewport-fit=cover` YOKKEN iOS'ta
         web görünümü yan çevrildiğinde hiç dönmüyordu (win 440x894 sabit kalıyor,
         yön portrait-primary'de takılıyor, orientationchange hiç tetiklenmiyordu).
         Aynı satıra `viewport-fit=cover` eklenince dönme düzeldi: yatayda
         win 956x440, yön landscape-primary, sayfa ekranı boydan boya dolduruyor.
         DİKKAT: bunu ÇALIŞMA ZAMANINDA JS ile eklemek İŞE YARAMIYOR — eskiden
         App.jsx tema efektinin içinde ekliyordu, geç kaldığı için dönme bozuk
         kalıyordu. O yazım kaldırıldı; tek ve sabit tanım burasıdır.
         Meta'yı JS ile DEĞİŞTİRME. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- ════════════════════════════════════════════════════════════════════
         DURUM ÇUBUĞU — SAYFA SAATİN ALTINA UZANSIN
         ════════════════════════════════════════════════════════════════════
         Bu iki satır YOKKEN iOS, ana ekrandan açılan uygulamada durum çubuğu
         için OPAK bir şerit ayırıyor ve sayfa onun ALTINDAN başlıyor. Üstteki
         solma perdesi de sayfayla birlikte aşağı kaydığı için etkisi
         görünmüyordu ("sadece perdenin ucu görünüyor, üst kısmı kapalı gibi").
         `black-translucent` ile şerit kalkıyor, içerik saatin altına kadar
         uzanıyor — perdenin var oluş sebebi de bu bölge zaten.

         ⚠ BİLİNEN BEDELİ: bu kipte iOS durum çubuğu yazısını (saat, pil)
         BEYAZ çiziyor. Açık temada beyaz saat okunmayabilir. Rahatsız ederse
         iki satırı da silmek yeterli; her şey bugünkü hâline döner.
         (Ara yol: `black-translucent` yerine `default` — şerit geri gelir ama
         tema rengiyle boyanır.)
         NOT: `viewport-fit=cover` yukarıdaki satırda ZATEN var ve şarttır;
         ikisi birlikte çalışır. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>vukuf</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
